appId: com.dlinkerartwork.paletteiq
productName: PaletteIQ Desktop
artifactName: PaletteIQ-Setup-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: desktop/build-resources
asar: true
afterPack: ./scripts/verify-desktop-package.cjs
files:
  - desktop/**/*.cjs
  - package.json
extraResources:
  - from: desktop/prerequisites/vc_redist.x64.exe
    to: prerequisites/vc_redist.x64.exe
  - from: dist/desktop-runtime
    to: paletteiq-runtime
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: PaletteIQ
  icon: desktop/build-resources/icon.ico
nsis:
  perMachine: true
  include: desktop/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PaletteIQ Desktop
